<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316" role="img" aria-label="Little Learner">
  <defs>
    <linearGradient id="llSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6e0"/>
      <stop offset="0.55" stop-color="#4bb3c9"/>
      <stop offset="1" stop-color="#2f83a6"/>
    </linearGradient>
    <linearGradient id="llScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a4a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c2a37" stop-opacity="0.93"/>
    </linearGradient>
  </defs>

  <rect width="240" height="316" fill="url(#llSky)"/>

  <!-- paper-cut sun -->
  <g transform="translate(190 58)">
    <circle r="22" fill="#ffe27a"/>
    <g stroke="#ffd15e" stroke-width="4" stroke-linecap="round">
      <path d="M0 -30 v-8"/><path d="M0 30 v8"/><path d="M-30 0 h-8"/><path d="M30 0 h8"/>
      <path d="M-21 -21 l-6 -6"/><path d="M21 -21 l6 -6"/>
    </g>
  </g>

  <!-- clouds -->
  <g fill="#fdf6e3" opacity="0.9">
    <ellipse cx="54" cy="66" rx="24" ry="12"/>
    <ellipse cx="72" cy="60" rx="16" ry="11"/>
  </g>

  <!-- paper-cut hills -->
  <path d="M0 232 q60 -26 120 0 t120 0 V316 H0 Z" fill="#3fa06f"/>
  <path d="M0 256 q60 -22 120 0 t120 0 V316 H0 Z" fill="#2f8358"/>

  <!-- ABC blocks -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="26" text-anchor="middle">
    <g transform="rotate(-8 74 176)">
      <rect x="52" y="150" width="44" height="44" rx="7" fill="#ff8fb0"/>
      <rect x="52" y="150" width="44" height="44" rx="7" fill="none" stroke="#e0648c" stroke-width="2"/>
      <text x="74" y="182" fill="#fff3f8">A</text>
    </g>
    <g transform="rotate(6 122 168)">
      <rect x="100" y="140" width="44" height="44" rx="7" fill="#ffd15e"/>
      <rect x="100" y="140" width="44" height="44" rx="7" fill="none" stroke="#e0a83c" stroke-width="2"/>
      <text x="122" y="172" fill="#6b4a10">B</text>
    </g>
    <g transform="rotate(-5 170 178)">
      <rect x="148" y="152" width="44" height="44" rx="7" fill="#7ce0d0"/>
      <rect x="148" y="152" width="44" height="44" rx="7" fill="none" stroke="#3fb0a0" stroke-width="2"/>
      <text x="170" y="184" fill="#0c4a44">C</text>
    </g>
  </g>

  <!-- title -->
  <rect y="200" width="240" height="116" fill="url(#llScrim)"/>
  <text x="120" y="242" text-anchor="middle" fill="#bff0ea" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">LEARNING</text>
  <text x="120" y="276" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Little</text>
  <text x="120" y="304" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Learner</text>
</svg>
