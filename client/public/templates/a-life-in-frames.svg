<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316" role="img" aria-label="A Life in Frames">
  <defs>
    <linearGradient id="lfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3ab"/>
      <stop offset="0.5" stop-color="#c9a267"/>
      <stop offset="1" stop-color="#8a5f34"/>
    </linearGradient>
    <radialGradient id="lfVign" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2410" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="lfScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1908" stop-opacity="0.93"/>
    </linearGradient>
  </defs>

  <rect width="240" height="316" fill="url(#lfSky)"/>

  <!-- sun disc -->
  <circle cx="120" cy="74" r="30" fill="#fff2d0" opacity="0.7"/>

  <!-- film strip across the middle -->
  <g transform="translate(0 118)">
    <rect x="-10" y="0" width="260" height="70" fill="#2c1c0d" transform="rotate(-6 120 35)"/>
    <g transform="rotate(-6 120 35)">
      <g fill="#e9d3ab">
        <rect x="4" y="6" width="8" height="8" rx="1.5"/><rect x="4" y="52" width="8" height="8" rx="1.5"/>
        <rect x="52" y="6" width="8" height="8" rx="1.5"/><rect x="52" y="52" width="8" height="8" rx="1.5"/>
        <rect x="100" y="6" width="8" height="8" rx="1.5"/><rect x="100" y="52" width="8" height="8" rx="1.5"/>
        <rect x="148" y="6" width="8" height="8" rx="1.5"/><rect x="148" y="52" width="8" height="8" rx="1.5"/>
        <rect x="196" y="6" width="8" height="8" rx="1.5"/><rect x="196" y="52" width="8" height="8" rx="1.5"/>
      </g>
      <!-- frames -->
      <rect x="20" y="18" width="34" height="34" rx="2" fill="#caa46b"/>
      <circle cx="37" cy="35" r="8" fill="#3a2410" opacity="0.5"/>
      <rect x="70" y="18" width="34" height="34" rx="2" fill="#d9b981"/>
      <path d="M78 50 q9 -14 18 0 z" fill="#3a2410" opacity="0.5"/>
      <rect x="120" y="18" width="34" height="34" rx="2" fill="#caa46b"/>
      <circle cx="137" cy="32" r="6" fill="#3a2410" opacity="0.5"/>
      <path d="M126 50 q11 -10 22 0 z" fill="#3a2410" opacity="0.5"/>
      <rect x="170" y="18" width="34" height="34" rx="2" fill="#d9b981"/>
      <circle cx="187" cy="35" r="8" fill="#3a2410" opacity="0.45"/>
    </g>
  </g>

  <rect width="240" height="316" fill="url(#lfVign)"/>

  <!-- title -->
  <rect y="196" width="240" height="120" fill="url(#lfScrim)"/>
  <text x="120" y="234" text-anchor="middle" fill="#f0dcb0" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">BIOGRAPHY</text>
  <text x="120" y="266" text-anchor="middle" fill="#fbf3e0" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="28">A Life</text>
  <text x="120" y="296" text-anchor="middle" fill="#fbf3e0" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="28">in Frames</text>
</svg>
