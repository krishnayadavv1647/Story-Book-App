<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316" role="img" aria-label="Bedtime Wonder">
  <defs>
    <linearGradient id="bwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20306b"/>
      <stop offset="0.55" stop-color="#3a2a63"/>
      <stop offset="1" stop-color="#241a44"/>
    </linearGradient>
    <radialGradient id="bwMoon" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#f2d98a"/>
    </radialGradient>
    <linearGradient id="bwScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a44" stop-opacity="0"/>
      <stop offset="1" stop-color="#160f2c" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="240" height="316" fill="url(#bwSky)"/>

  <!-- soft watercolour glow -->
  <circle cx="176" cy="78" r="70" fill="#5b6cc0" opacity="0.18"/>
  <circle cx="70" cy="150" r="60" fill="#7a5bb0" opacity="0.14"/>

  <!-- moon -->
  <circle cx="172" cy="74" r="34" fill="url(#bwMoon)"/>
  <circle cx="158" cy="66" r="30" fill="#3a2a63" opacity="0.9"/>

  <!-- stars -->
  <g fill="#fdf6e3">
    <circle cx="46" cy="52" r="2.2"/>
    <circle cx="92" cy="40" r="1.6"/>
    <circle cx="120" cy="96" r="1.8"/>
    <circle cx="60" cy="104" r="1.4"/>
    <circle cx="30" cy="128" r="1.6"/>
    <circle cx="200" cy="132" r="1.6"/>
    <circle cx="212" cy="52" r="1.4"/>
  </g>
  <g stroke="#fdf6e3" stroke-width="1.4" opacity="0.9">
    <path d="M84 70 l0 8 M80 74 l8 0"/>
    <path d="M150 128 l0 7 M146.5 131.5 l7 0"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 236 C 60 208 120 262 240 224 L240 316 L0 316 Z" fill="#2a1f4d"/>
  <path d="M0 262 C 80 240 150 286 240 258 L240 316 L0 316 Z" fill="#1d1638"/>

  <!-- title scrim + lettering -->
  <rect y="196" width="240" height="120" fill="url(#bwScrim)"/>
  <text x="120" y="238" text-anchor="middle" fill="#e9c66a" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" opacity="0.95">BEDTIME</text>
  <text x="120" y="272" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Bedtime</text>
  <text x="120" y="300" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Wonder</text>
</svg>
