<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316" role="img" aria-label="Magical Kingdom">
  <defs>
    <linearGradient id="mkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b86"/>
      <stop offset="0.5" stop-color="#5b3fa6"/>
      <stop offset="1" stop-color="#2a1c5e"/>
    </linearGradient>
    <radialGradient id="mkMoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#b79be6"/>
    </radialGradient>
    <linearGradient id="mkScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1548" stop-opacity="0"/>
      <stop offset="1" stop-color="#160e33" stop-opacity="0.93"/>
    </linearGradient>
  </defs>

  <rect width="240" height="316" fill="url(#mkSky)"/>
  <circle cx="186" cy="66" r="26" fill="url(#mkMoon)" opacity="0.85"/>

  <!-- stars -->
  <g fill="#fdf6e3">
    <circle cx="40" cy="48" r="1.8"/><circle cx="88" cy="34" r="1.4"/>
    <circle cx="150" cy="40" r="1.6"/><circle cx="30" cy="96" r="1.4"/>
    <circle cx="210" cy="120" r="1.6"/><circle cx="64" cy="128" r="1.4"/>
  </g>

  <!-- big sparkle -->
  <g transform="translate(60 92)">
    <path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z" fill="#ffe27a"/>
    <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z" fill="#fff6d8"/>
  </g>

  <!-- castle silhouette -->
  <g fill="#1b1240">
    <rect x="60" y="150" width="120" height="66"/>
    <!-- towers -->
    <rect x="52" y="128" width="26" height="88"/>
    <rect x="162" y="128" width="26" height="88"/>
    <rect x="104" y="112" width="32" height="104"/>
    <!-- battlements -->
    <path d="M52 128 h26 v-8 h-6 v6 h-6 v-6 h-6 v6 h-2 z"/>
    <path d="M162 128 h26 v-8 h-6 v6 h-6 v-6 h-6 v6 h-2 z"/>
    <!-- spires -->
    <path d="M52 128 l13 -22 l13 22 z"/>
    <path d="M162 128 l13 -22 l13 22 z"/>
    <path d="M104 112 l16 -26 l16 26 z"/>
    <!-- flags -->
    <path d="M120 86 v-14 l10 4 l-10 4" fill="#ff8fb0"/>
  </g>
  <!-- gate + windows -->
  <path d="M110 216 v-30 a10 10 0 0 1 20 0 v30 z" fill="#5b3fa6"/>
  <g fill="#ffe27a" opacity="0.9">
    <rect x="60" y="158" width="7" height="12" rx="3"/>
    <rect x="173" y="158" width="7" height="12" rx="3"/>
    <rect x="116" y="140" width="8" height="14" rx="4"/>
  </g>

  <!-- hill -->
  <path d="M0 210 C 70 196 170 208 240 200 L240 316 L0 316 Z" fill="#241a52"/>

  <!-- title -->
  <rect y="196" width="240" height="120" fill="url(#mkScrim)"/>
  <text x="120" y="238" text-anchor="middle" fill="#c9b6ff" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">MAGICAL ADVENTURE</text>
  <text x="120" y="272" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Magical</text>
  <text x="120" y="300" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30">Kingdom</text>
</svg>
