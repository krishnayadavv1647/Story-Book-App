<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316" role="img" aria-label="Birthday Surprise">
  <defs>
    <linearGradient id="bdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fc0"/>
      <stop offset="0.5" stop-color="#d76bb8"/>
      <stop offset="1" stop-color="#7d3ea0"/>
    </linearGradient>
    <linearGradient id="bdScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1257" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a0d40" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="240" height="316" fill="url(#bdSky)"/>

  <!-- confetti -->
  <g opacity="0.95">
    <rect x="40" y="40" width="8" height="8" rx="2" fill="#ffe27a" transform="rotate(20 44 44)"/>
    <rect x="196" y="52" width="8" height="8" rx="2" fill="#7ce0d0" transform="rotate(-15 200 56)"/>
    <rect x="70" y="92" width="7" height="7" rx="2" fill="#fdf6e3" transform="rotate(35 73 95)"/>
    <rect x="176" y="104" width="7" height="7" rx="2" fill="#ffe27a" transform="rotate(10 180 108)"/>
    <circle cx="52" cy="140" r="4" fill="#7ce0d0"/>
    <circle cx="200" cy="150" r="4" fill="#ffe27a"/>
    <circle cx="120" cy="34" r="4" fill="#fdf6e3"/>
  </g>

  <!-- balloons -->
  <g>
    <ellipse cx="66" cy="70" rx="16" ry="20" fill="#ff6f91"/>
    <path d="M66 90 q-3 8 2 16" stroke="#fdf6e3" stroke-width="1.5" fill="none" opacity="0.7"/>
    <ellipse cx="182" cy="80" rx="15" ry="19" fill="#6fd0c4"/>
    <path d="M182 99 q3 8 -2 16" stroke="#fdf6e3" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- cake -->
  <g>
    <!-- plate -->
    <ellipse cx="120" cy="204" rx="62" ry="10" fill="#2a0d40" opacity="0.35"/>
    <!-- tiers -->
    <rect x="74" y="150" width="92" height="52" rx="8" fill="#fff3f8"/>
    <rect x="74" y="150" width="92" height="16" rx="8" fill="#ffd7e6"/>
    <path d="M74 166 q11 12 23 0 q11 12 23 0 q11 12 23 0 q11 12 23 0 v6 h-92 z" fill="#ffb3d1"/>
    <rect x="86" y="128" width="68" height="34" rx="7" fill="#ffe7a0"/>
    <path d="M86 140 q9 10 17 0 q9 10 17 0 q9 10 17 0 q9 10 17 0 v4 h-68 z" fill="#ffd15e"/>
    <!-- candles -->
    <g>
      <rect x="104" y="104" width="5" height="22" rx="2" fill="#7ce0d0"/>
      <rect x="132" y="104" width="5" height="22" rx="2" fill="#ff8fb0"/>
      <ellipse cx="106.5" cy="100" rx="4" ry="7" fill="#ffe27a"/>
      <ellipse cx="134.5" cy="100" rx="4" ry="7" fill="#ffe27a"/>
    </g>
  </g>

  <!-- title -->
  <rect y="196" width="240" height="120" fill="url(#bdScrim)"/>
  <text x="120" y="234" text-anchor="middle" fill="#ffd7e6" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">CELEBRATION</text>
  <text x="120" y="268" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="29">Birthday</text>
  <text x="120" y="296" text-anchor="middle" fill="#fdf6e3" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="29">Surprise</text>
</svg>
