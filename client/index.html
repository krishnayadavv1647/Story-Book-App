<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#02090d" />
    <meta name="description" content="Create beautiful illustrated storybooks in minutes." />
    <!--
      Inter is the typeface used throughout the approved Figma sources — that is
      the *application* — and EB Garamond is the default book face, measured off
      the reference book. These two are always needed, so they load up front.

      Every other face the editor's font picker offers is a Google font fetched
      on demand the moment it is chosen or a page uses it (see lib/loadFont.js),
      so the catalogue can be large without loading hundreds of files here.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>StoryBook Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
